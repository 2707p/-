<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>창원성민여자고등학교 포털</title>

  <style>
    * { box-sizing: border-box; font-family: "Noto Sans KR", sans-serif; }
    body { margin: 0; background: #f5f8ff; color: #333; }

    header {
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 8%;
      font-weight: bold;
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { height: 38px; }
    .logo span { font-size: 17px; color: #1f57c9; }

    nav a {
      margin: 0 14px;
      color: #222;
      text-decoration: none;
      font-size: 15px;
    }
    nav a:hover { color: #1f57c9; }

    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(180deg, #e8f1ff 0%, #ffffff 100%);
    }

    .login-box {
      background: white;
      width: 380px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      padding: 40px;
      text-align: center;
      border-top: 6px solid #1f57c9;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #1f57c9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .main-page { display: none; min-height: 100vh; }

    .hero {
      background: #eaf1ff;
      text-align: center;
      padding: 60px 20px;
    }

    .menu-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      padding: 60px 10%;
    }

    .menu-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-card:hover {
      transform: translateY(-5px);
    }

    .menu-card img {
      width: 60px;
      margin-bottom: 10px;
    }

    footer {
      background: white;
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

<!-- 로그인 -->
<div class="login-wrapper" id="loginPage">
  <div class="login-box">
    <h2>창원성민여자고등학교</h2>
    <p>포털 로그인</p>
    <input id="studentId" placeholder="아이디">
    <input id="studentPw" type="password" placeholder="비밀번호">
    <button onclick="login()">로그인</button>
  </div>
</div>

<!-- 메인 -->
<div class="main-page" id="mainPage">
  <header>
    <div class="logo">
      <img src="https://primary-green-gitpuljxwi.edgeone.app/sungmin.png">
      <span>창원성민여자고등학교</span>
    </div>
    <nav>
      <a href="#">홈</a>
      <a href="#">공지사항</a>
      <a href="#" onclick="logout()">로그아웃</a>
    </nav>
  </header>

  <div class="hero">
    <h2>창원성민여자고등학교 포털</h2>
    <p>환영합니다</p>
  </div>

  <section class="menu-container">

    <!-- 학사일정 -->
    <div class="menu-card" onclick="location.href='jm.html'">
      <img src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png">
      <h3>학사일정</h3>
      <p>학교 일정 확인</p>
    </div>

    <!-- 급식 -->
    <div class="menu-card" onclick="location.href='bob.html'">
      <img src="https://cdn-icons-png.flaticon.com/512/3480/3480521.png">
      <h3>오늘의 급식</h3>
      <p>오늘 급식 메뉴</p>
    </div>

    <!-- 시간표 -->
    <div class="menu-card" onclick="location.href='hn.html'">
      <img src="https://cdn-icons-png.flaticon.com/512/1688/1688450.png">
      <h3>시간표</h3>
      <p>오늘 수업 확인</p>
    </div>

  </section>

  <footer>
    © 2025 창원성민여자고등학교
  </footer>
</div>

<script>
  const students = [];
  for (let g = 1; g <= 3; g++) {
    for (let c = 1; c <= 7; c++) {
      for (let n = 1; n <= 28; n++) {
        students.push({ id: `${g}${String(c).padStart(2,'0')}${String(n).padStart(2,'0')}`, pw: "1234" });
      }
    }
  }

  function login() {
    const id = studentId.value.trim();
    const pw = studentPw.value.trim();
    const user = students.find(s => s.id === id && s.pw === pw);
    if (!user) return alert("로그인 실패");
    localStorage.setItem("user", id);
    showMain();
  }

  function showMain() {
    loginPage.style.display = "none";
    mainPage.style.display = "block";
  }

  function logout() {
    localStorage.removeItem("user");
    mainPage.style.display = "none";
    loginPage.style.display = "flex";
  }

  window.onload = () => {
    if (localStorage.getItem("user")) showMain();
  }
</script>

</body>
</html>
